services:
  # ── Redis (for Celery) ────────────────────────────────
  redis:
    image: redis:alpine
    container_name: autoseo-redis
    restart: always
    networks:
      - autoseo-network

  # ── Backend (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoseo-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "8010:8000" # Expose backend on port 8010
    depends_on:
      - redis
    networks:
      - autoseo-network

  # ── Frontend (React/Nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://autoseo.agpkacademy.in/api/v1
    container_name: autoseo-frontend
    restart: always
    ports:
      - "3010:80" # Expose frontend on port 3010
    depends_on:
      - backend
    networks:
      - autoseo-network

networks:
  autoseo-network:
    driver: bridge
