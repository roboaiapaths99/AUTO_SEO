services:
  # ── MongoDB ──────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: autoseo-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - autoseo-network

  # ── Redis (for Celery) ────────────────────────────────
  redis:
    image: redis:alpine
    container_name: autoseo-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - autoseo-network

  # ── Backend (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoseo-backend
    restart: always
    environment:
      - APP_ENV=production
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=autoseo
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - mongodb
      - redis
    networks:
      - autoseo-network

  # ── Frontend (React/Nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://autoseo.agpkacademy.in/api/v1
    container_name: autoseo-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - autoseo-network

  # ── Reverse Proxy (Nginx) ──────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: autoseo-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - autoseo-network

networks:
  autoseo-network:
    driver: bridge

volumes:
  mongodb_data:
  certbot_etc:
  certbot_var:
